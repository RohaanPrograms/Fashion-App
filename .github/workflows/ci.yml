# Continuous Integration: runs automatically on every push and pull request.
# It checks that both halves of the project still build/typecheck cleanly.
#
# Two independent jobs run in parallel:
#   backend  — installs Python deps and verifies the FastAPI app imports.
#   mobile   — installs Node deps, type-checks the Expo app, runs its Jest tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile all source
        run: python -m compileall app

      - name: Verify the app imports cleanly
        run: python -c "import app.main; print('app imports OK')"

      # The tests stub Supabase, so this needs no credentials and no network.
      - name: Run tests
        run: python -m pytest -q

  mobile:
    name: Mobile (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same major version as the development machine (Node 20 is end-of-life).
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Pure app logic (session start-up, feed queue, set rules), no device needed.
      - name: Run tests
        run: npx jest --ci
