[pytest]
testpaths = tests
# Run from backend/ so `import app.main` resolves without setting PYTHONPATH.
pythonpath = .

# Treat warnings as errors so our own get noticed, with one exception:
# supabase 2.11.0 imports the deprecated `gotrue` package on import. That is
# the library's own warning, not ours, and nothing in this project can silence
# it at the source. Remove this line once supabase moves to `supabase_auth`.
filterwarnings =
    error
    ignore:The `gotrue` package is deprecated:DeprecationWarning
